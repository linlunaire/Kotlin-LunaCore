plugins {
	id 'java-library'
	id 'org.jetbrains.kotlin.jvm'
	id 'maven-publish'
}

base { archivesName = 'transit-core' }
java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
	withSourcesJar()
}
kotlin {
	jvmToolchain(25)
	coreLibrariesVersion = rootProject.kotlin_runtime_version
	compilerOptions {
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
		jvmDefault = org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode.NO_COMPATIBILITY
		moduleName = 'transit_core'
	}
}
// Packaging/resolver probes are isolated from both the runtime library and its
// policy tests. Neither their classes nor loader dependencies enter the mod JAR.
sourceSets { verification }
configurations {
	verificationElements {
		canBeConsumed = true
		canBeResolved = false
		extendsFrom verificationImplementation, verificationRuntimeOnly
	}
}
def verificationJar = tasks.register('verificationJar', Jar) {
	archiveClassifier = 'verification'
	from sourceSets.verification.output
}
artifacts { verificationElements verificationJar }
dependencies {
	implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.kotlin_runtime_version}"
	verificationImplementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.kotlin_runtime_version}"
	verificationImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
	verificationImplementation 'net.neoforged:JarJarSelector:0.5.1'
}
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 25
}
tasks.register('checkCoreIsolation') {
	group = 'verification'
	inputs.files(configurations.compileClasspath)
	doLast {
		configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
			if (!(artifact.moduleVersion.id.group in ['org.jetbrains.kotlin', 'org.jetbrains'])) {
				throw new GradleException("Unexpected core dependency: ${artifact.moduleVersion.id}")
			}
			if (artifact.name == 'kotlin-stdlib' && artifact.moduleVersion.id.version != rootProject.kotlin_runtime_version) {
				throw new GradleException("Core stdlib exceeds the shared runtime floor: ${artifact.moduleVersion.id}")
			}
		}
	}
}
tasks.named('check') { dependsOn 'checkCoreIsolation' }

['FrameGeometryCache': 'collection', 'FrameMembership': 'collection', 'BoundedTaskDispatcher': 'concurrent', 'JavaInterop': 'interop'].each { checkName, namespace ->
	tasks.register("check${checkName}", JavaExec) {
		group = 'verification'
		dependsOn 'contractCheckJar'
		classpath = files(tasks.named('contractCheckJar')) + sourceSets.main.output + configurations.testRuntimeClasspath
		mainClass = "io.github.linlunaire.transitcore.${namespace}.${checkName}Check"
	}
	tasks.named('check') { dependsOn "check${checkName}" }
}

// These are executable contract checks, not JUnit tests. Gradle's test task runs
// the same checks as check, so ordinary IDE/CI test invocations do not skip them.
tasks.named('test') {
	enabled = false
	dependsOn 'checkFrameGeometryCache', 'checkFrameMembership', 'checkBoundedTaskDispatcher', 'checkJavaInterop'
}

// Consumers reuse the executable contracts without depending on source layout
// or on our Kotlin compiler. This fixture is never published as a runtime library.
def contractCheckJar = tasks.register('contractCheckJar', Jar) {
	archiveClassifier = 'checks'
	from sourceSets.test.output
}
tasks.named('assemble') { dependsOn contractCheckJar }

publishing {
	publications {
		transitCore(MavenPublication) {
			from components.java
			artifactId = 'transit-core'
			pom {
				name = 'Kotlin LunaCore'
				description = 'A shared Kotlin runtime and small JVM utilities for Minecraft mods.'
				licenses { license { name = 'LGPL-3.0-or-later'; url = 'https://www.gnu.org/licenses/lgpl-3.0.html' } }
			}
		}
	}
}
tasks.named('jar') { from(rootProject.files('LICENSE', 'COPYING', 'NOTICE.md')) { into 'META-INF/transit-core' }; from(rootProject.file('licenses')) { into 'META-INF/transit-core/licenses' } }
tasks.named('sourcesJar') { from(rootProject.files('LICENSE', 'COPYING', 'NOTICE.md')) { into 'META-INF/transit-core' }; from(rootProject.file('licenses')) { into 'META-INF/transit-core/licenses' } }

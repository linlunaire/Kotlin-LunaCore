plugins {
	id 'java-library'
	id 'org.jetbrains.kotlin.jvm'
	id 'maven-publish'
}

base { archivesName = 'transit-core' }
java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
	withSourcesJar()
}
kotlin {
	jvmToolchain(25)
	coreLibrariesVersion = rootProject.kotlin_runtime_version
	compilerOptions {
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
		jvmDefault = org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode.NO_COMPATIBILITY
		moduleName = 'transit_core'
	}
}
dependencies { implementation "org.jetbrains.kotlin:kotlin-stdlib:${rootProject.kotlin_runtime_version}" }
tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 25
}
tasks.register('checkCoreIsolation') {
	group = 'verification'
	inputs.files(configurations.compileClasspath)
	doLast {
		configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
			if (!(artifact.moduleVersion.id.group in ['org.jetbrains.kotlin', 'org.jetbrains'])) {
				throw new GradleException("Unexpected core dependency: ${artifact.moduleVersion.id}")
			}
			if (artifact.name == 'kotlin-stdlib' && artifact.moduleVersion.id.version != rootProject.kotlin_runtime_version) {
				throw new GradleException("Core stdlib exceeds the shared runtime floor: ${artifact.moduleVersion.id}")
			}
		}
	}
}
tasks.named('check') { dependsOn 'checkCoreIsolation' }

// During migration, the unconverted callers remain in the old directory.
sourceSets.test.java {
	srcDir rootProject.file('tests')
	include '**/FrameGeometryCacheCheck.java', '**/FrameMembershipCheck.java', '**/BoundedTaskDispatcherCheck.java', '**/JavaInteropCheck.java'
}

['FrameGeometryCache': 'collection', 'FrameMembership': 'collection', 'BoundedTaskDispatcher': 'concurrent'].each { checkName, namespace ->
	tasks.register("check${checkName}", JavaExec) {
		group = 'verification'
		dependsOn 'testClasses'
		classpath = sourceSets.test.runtimeClasspath
		mainClass = "io.github.linlunaire.transitcore.${namespace}.${checkName}Check"
	}
	tasks.named('check') { dependsOn "check${checkName}" }
}

// These are executable contract checks, not JUnit tests. Gradle's test task runs
// the same checks as check, so ordinary IDE/CI test invocations do not skip them.
tasks.named('test') {
	enabled = false
	dependsOn 'checkFrameGeometryCache', 'checkFrameMembership', 'checkBoundedTaskDispatcher'
}

publishing {
	publications {
		transitCore(MavenPublication) {
			from components.java
			artifactId = 'transit-core'
			pom {
				name = 'Kotlin LunaCore'
				description = 'A next-generation Kotlin foundation for the Minecraft mod ecosystem.'
				licenses { license { name = 'MIT'; url = 'https://opensource.org/license/mit' } }
			}
		}
	}
}
tasks.named('jar') { from(rootProject.file('LICENSE')) { into 'META-INF/transit-core' } }
tasks.named('sourcesJar') { from(rootProject.file('LICENSE')) { into 'META-INF/transit-core' } }

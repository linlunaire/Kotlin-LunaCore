name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify recoverable legacy build inputs
        shell: pwsh
        run: |
          git fetch --depth=1 origin tag transit-core-0.1.0
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the preserved legacy archive' }
          ./tools/prepare-legacy-1.21.1.ps1 -VerifyOnly
      - run: bash gradlew build --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Kotlin-LunaCore-26.2
          path: build/release/*.jar
          if-no-files-found: error
